server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.html index.php;

    client_max_body_size 16m;

    location = / {
        return 302 $scheme://$http_host/app/;
    }

    location = /app {
        return 301 $scheme://$http_host/app/;
    }

    location = /favicon.ico {
        return 302 $scheme://$http_host/app/favicon.ico;
    }

    location = /robots.txt {
        return 302 $scheme://$http_host/app/robots.txt;
    }

    location = /og-image.jpg {
        return 302 $scheme://$http_host/app/og-image.jpg;
    }

    location ^~ /app/ {
        try_files $uri /app/index.html;
    }

    location /api {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }

    location ~ ^/index\.php(/|$) {
        return 404;
    }

    location ~ \.php$ {
        return 404;
    }
}
