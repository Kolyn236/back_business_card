framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
            failed: '%env(MESSENGER_FAILED_TRANSPORT_DSN)%'

        routing:
            App\Feedback\Application\Message\ProcessFeedbackSubmissionMessage: async
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            App\Feedback\Infrastructure\Notification\Message\SendTelegramFeedbackMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
