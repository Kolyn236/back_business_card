name: back_business_card

x-app-environment: &app-environment
  APP_ENV: ${DOCKER_APP_ENV:-prod}
  APP_DEBUG: ${DOCKER_APP_DEBUG:-0}
  APP_SECRET: ${APP_SECRET:-change-me}
  APP_SHARE_DIR: ${APP_SHARE_DIR:-var/share}
  DEFAULT_URI: ${DOCKER_DEFAULT_URI:-http://localhost:8080}
  MAILER_DSN: ${DOCKER_MAILER_DSN:-smtp://mailer:1025}
  MESSENGER_TRANSPORT_DSN: ${DOCKER_MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
  MESSENGER_FAILED_TRANSPORT_DSN: ${DOCKER_MESSENGER_FAILED_TRANSPORT_DSN:-redis://redis:6379/failed_messages}
  CACHE_APP_DSN: ${DOCKER_CACHE_APP_DSN:-redis://redis:6379/1}

x-app-build: &app-build
  context: .
  dockerfile: backend/Dockerfile
  target: prod

x-app-service: &app-service
  build: *app-build
  env_file:
    - path: ./backend/.env
      required: true
    - path: ./backend/.env.local
      required: false
  environment: *app-environment
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  app:
    <<: *app-service
    image: back-business-card-app:latest

  worker:
    <<: *app-service
    image: back-business-card-app:latest
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "--no-interaction"]

  nginx:
    build:
      context: .
      dockerfile: backend/Dockerfile.nginx
    image: back-business-card-nginx:latest
    depends_on:
      app:
        condition: service_started
    ports:
      - "${DOCKER_HTTP_PORT:-8080}:80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
