# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.feedback.email_from: '%env(string:FEEDBACK_MAIL_FROM)%'
    app.feedback.email_from_name: '%env(string:FEEDBACK_MAIL_FROM_NAME)%'
    app.feedback.email_to: '%env(string:FEEDBACK_MAIL_TO)%'
    app.feedback.email_envelope_sender: '%env(string:FEEDBACK_MAIL_ENVELOPE_SENDER)%'
    app.feedback.telegram_bot_token: '%env(string:TELEGRAM_BOT_TOKEN)%'
    app.feedback.telegram_chat_id: '%env(string:TELEGRAM_CHAT_ID)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Feedback\Application\Port\FeedbackSubmissionProcessorInterface:
            tags: ['app.feedback_submission_processor']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Feedback\Application\Service\SubmitFeedbackService:
        arguments:
            $messageBus: '@messenger.default_bus'

    App\Feedback\Application\MessageHandler\ProcessFeedbackSubmissionMessageHandler:
        arguments:
            $processors: !tagged_iterator { tag: app.feedback_submission_processor, default_priority_method: getPriority }
            $cache: '@cache.app'

    App\Feedback\Infrastructure\Config\TelegramBotConfig:
        arguments:
            $botToken: '%app.feedback.telegram_bot_token%'
            $chatId: '%app.feedback.telegram_chat_id%'

    App\Feedback\Infrastructure\Notification\FeedbackEmailFactory:
        arguments:
            $fromAddress: '%app.feedback.email_from%'
            $fromName: '%app.feedback.email_from_name%'
            $toAddress: '%app.feedback.email_to%'
            $envelopeSender: '%app.feedback.email_envelope_sender%'

    App\Feedback\Infrastructure\Notification\EmailFeedbackProcessor:
        arguments:
            $mailer: '@mailer.mailer'

    App\Feedback\Infrastructure\Notification\EventSubscriber\FeedbackTelegramDeliverySubscriber:
        arguments:
            $logger: '@monolog.logger.telegram'

    App\Feedback\Infrastructure\Notification\EventSubscriber\FeedbackEmailDeliverySubscriber:
        arguments:
            $logger: '@monolog.logger.mailer'
